name: verify

# Single quality gate. CI runs the SAME entry point as Developers and AI agents: `task verify`.
# All check logic lives in scripts/ + Taskfile.yml (single source of truth) — NOT in this file.
# Register the "verify" job as a Required Status Check on protected branches (main, release/*).

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

permissions:
  contents: read
  pull-requests: read
# 注: ブランチ保護の読み取り（scripts/checks/adoption.sh / 強制台帳 #22）には
# リポジトリ管理者権限が要るが、GITHUB_TOKEN には付与できない
# （`administration` は permissions: に指定可能なスコープではない）。
# CI で当該チェックを実効化したい場合は、管理者読み取り権限を持つ PAT を
# シークレット ADMIN_READ_TOKEN に設定する（任意。未設定なら確認不能として警告する）。

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for secret scan and PR diff

      - name: Install pinned toolchain (mise → task / lychee / gitleaks / trivy / markdownlint / node)
        uses: jdx/mise-action@v4
        with:
          # mise の一部リリース（v2026.6.7）は linux-x64 アセットが欠落して 404 になった。
          # 再発時の切り分けを容易にするため版を固定する（浮動にしない）。
          # 2026-08-08 時点で上流は解消済みのため、資産の存在を確認した版へ更新した。
          version: 2026.8.3

      - name: task verify
        run: task verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: task verify:pr (governance — pull_request only)
        if: github.event_name == 'pull_request'
        run: task verify:pr
        env:
          # adoption.sh が gh CLI を使うために必要（未指定だと未認証で失敗する）。
          # ADMIN_READ_TOKEN（管理者読み取り権限を持つ PAT）が設定されていればそれを優先し、
          # ブランチ保護チェックが実効化される。未設定なら GITHUB_TOKEN にフォールバックし、
          # 保護は読めないため adoption.sh が「確認不能」として警告する（強制台帳 #22）。
          GITHUB_TOKEN: ${{ secrets.ADMIN_READ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
