name: verify

# Single quality gate. CI runs the SAME entry point as Developers and AI agents: `task verify`.
# All check logic lives in scripts/ + Taskfile.yml (single source of truth) — NOT in this file.
# Register the "verify" job as a Required Status Check on protected branches (main, release/*).
#
# PR-context governance（task verify:pr）はここでは実行しない。理由: `pull_request` トリガは
# PR head を checkout するため、PR 自身が scripts/checks/*.sh を改変すれば「改変後のロジックで
# 自分自身が検査される」自己参照問題が生じる（外部レビュー指摘・2026-08-21。実際に
# pr_governance.sh へ exit 0 を足すだけで permission-impact 要求ごと無効化できることを確認した）。
# base ref のコードだけで検査する governance-gate.yml（pull_request_target）に一本化した。
# こちらは required status check の対象から外し、governance-gate 側を登録する
# （ADOPTION.md「ステップ3」）。

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
    # 既定の activity types は [opened, synchronize, reopened] で `edited` を含まない。
    # ベースブランチの付け替えは `edited` として発火するため、既定のままだと stacked PR
    # （上流 PR のマージ後、GitHub が下流 PR のベースを main へ自動で付け替える）で
    # verify が一度も起動しない。governance-gate.yml は `edited` を列挙していて起動するため、
    # 「governance-gate だけが緑」の PR が生まれる。verify を必須ステータスチェックに
    # 登録していればマージがブロックされて詰まり、登録漏れがあれば verify を通さずに
    # マージできてしまう（fail-open。強制台帳 #22 の休眠と重なると実害になる）。
    #
    # 差分規模の上限（Class A=200行／development-process.md「5.」）は PR の分割を促し、
    # 分割は stacked PR を生み、stacked PR は必ずベース付け替えを経由する。つまり本
    # テンプレート自身の設計がこの経路を常用させるため、既定の types では不足する。
    # governance-gate.yml と同じ types に揃える（labeled/unlabeled はラベルを見ない
    # verify には不要なため含めない）。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for secret scan and PR diff

      - name: Install pinned toolchain (mise → task / lychee / gitleaks / trivy / markdownlint / node)
        uses: jdx/mise-action@v4
        with:
          # mise の一部リリース（v2026.6.7）は linux-x64 アセットが欠落して 404 になった。
          # 再発時の切り分けを容易にするため版を固定する（浮動にしない）。
          # 2026-08-08 時点で上流は解消済みのため、資産の存在を確認した版へ更新した。
          version: 2026.8.3

      - name: task verify
        run: task verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
