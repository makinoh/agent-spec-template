name: verify

# Single quality gate. CI runs the SAME entry point as Developers and AI agents: `task verify`.
# All check logic lives in scripts/ + Taskfile.yml (single source of truth) — NOT in this file.
# Register the "verify" job as a Required Status Check on protected branches (main, release/*).

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

permissions:
  contents: read
  pull-requests: read
  # ブランチ保護の読み取りに必要（scripts/checks/adoption.sh / 強制台帳 #22）。
  # これが無いと保護設定を取得できず、「未設定」と「確認不能」を区別できないまま
  # 助言チェックが常に警告を出し続ける＝ゲートが実質機能しない状態になる。
  administration: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for secret scan and PR diff

      - name: Install pinned toolchain (mise → task / lychee / gitleaks / trivy / markdownlint / node)
        uses: jdx/mise-action@v4
        with:
          # mise の latest (例: v2026.6.7) は linux-x64 アセットが欠落して 404 になる場合がある。
          # アセットが存在する版に固定する（上流が修正されたら更新可）。
          version: 2026.6.6

      - name: task verify
        run: task verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: task verify:pr (governance — pull_request only)
        if: github.event_name == 'pull_request'
        run: task verify:pr
        env:
          # adoption.sh が gh CLI でブランチ保護を照会するために必要（未指定だと未認証で失敗する）。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
