# Single source of truth for quality gates.
# Developers, AI agents (Claude Code / Gemini CLI / Copilot / Codex), git hooks, and
# GitHub Actions ALL run the same entry point:  `task verify`  (full)  /  `task verify:fast` (commit).
# Install Task + tools:  task setup   (uses mise / .mise.toml).  List tasks:  task --list
version: '3'
silent: true

# UI 再現性レイヤ（constitution.md「10.1」）。UI スタック未導入でも読み込めるよう optional。
# 実行は scripts/checks/ui.sh 経由で verify / verify:fast に接続する（未導入時は no-op）。
includes:
  ui:
    taskfile: ./Taskfile.ui.yml
    optional: true

tasks:
  default:
    desc: "Run the full quality gate (alias of verify)"
    cmds:
      - task: verify

  verify:
    desc: "FULL quality gate — single entry point for Devs / AI agents / CI"
    cmds:
      - task: verify:fast
      - task: check:adr-index
      - task: check:links
      - task: check:secrets
      - task: check:deps
      - task: check:sast
      - task: check:arch-boundaries
      - task: check:build
      - task: check:ui
      - task: check:selftest

  verify:fast:
    desc: "FAST checks for pre-commit (structure / ADR / front matter / prompts / markdown / enforcement ledger / UI / constitution sync)"
    cmds:
      - task: check:structure
      - task: check:adr
      - task: check:adr-content
      - task: check:frontmatter
      - task: check:prompts
      - task: check:markdown
      - task: check:enforcement-ledger
      - task: check:governance-metrics
      - task: check:ui-fast
      - task: check:constitution-sync
      - task: check:ratification-sync

  verify:pr:
    desc: "PR-context governance (run by CI on pull_request)"
    cmds:
      - task: check:pr-governance
      - task: check:adr-immutability
      - task: check:adoption
      - task: check:diff-size

  # --- individual checks: each maps to ONE script (the single source of truth) ---
  check:structure:
    cmds: ["bash scripts/checks/structure.sh"]
  # 簡潔ビュー（.specify/memory/constitution.md）のバージョンが正本（constitution.md）に追従しているか（WU09-01/GP-0010）。
  check:constitution-sync:
    cmds: ["bash scripts/checks/constitution-sync.sh"]
  # constitution.md のバージョンが governance/decisions/ の批准を追い越していないか（advisory。外部レビュー指摘）。
  check:ratification-sync:
    cmds: ["bash scripts/checks/ratification-sync.sh"]
  check:adr:
    cmds: ["bash scripts/checks/adr.sh"]
  check:adr-content:
    cmds: ["bash scripts/checks/adr-content.sh"]
  check:adr-immutability:
    cmds: ["bash scripts/checks/adr-immutability.sh"]
  check:prompts:
    cmds: ["bash scripts/checks/prompts.sh"]
  check:adoption:
    cmds: ["bash scripts/checks/adoption.sh"]
  check:frontmatter:
    cmds: ["bash scripts/checks/frontmatter.sh"]
  check:markdown:
    cmds: ["bash scripts/checks/markdown.sh"]
  check:adr-index:
    cmds: ["bash scripts/checks/adr-index.sh"]
  # 強制台帳のスキーマ整合性（憲章「3. 基本原則」検証手段の選択／「8.」ブートストラップ規定の機械化）。
  check:enforcement-ledger:
    cmds: ["bash scripts/checks/enforcement-ledger.sh"]
  # 統治健全性メトリクス（憲章「7. 変更管理」定期見直し）。機械強制率の非減少制約。
  check:governance-metrics:
    cmds: ["bash scripts/checks/governance-metrics.sh"]
  check:links:
    cmds: ["bash scripts/checks/links.sh"]
  check:secrets:
    cmds: ["bash scripts/checks/secrets.sh"]
  check:deps:
    cmds: ["bash scripts/checks/deps.sh"]
  # 第一者コードの静的解析（SAST）。休眠/活性化のスタック検出とゲート配線（constitution.md「8.」／WU-04）。
  check:sast:
    cmds: ["bash scripts/checks/sast.sh"]
  # アーキテクチャ境界・循環依存の検証。休眠/活性化のスタック検出とゲート配線（外部レビュー指摘）。
  check:arch-boundaries:
    cmds: ["bash scripts/checks/arch-boundaries.sh"]
  check:build:
    cmds: ["bash scripts/checks/build.sh"]
  check:pr-governance:
    cmds: ["bash scripts/checks/pr_governance.sh"]
  # 差分規模の計測（development-process.md「5.」新設 MUST NOT／WU-08）。上限未確定のため advisory。
  check:diff-size:
    cmds: ["bash scripts/checks/diff-size.sh"]
  # ゲート自己診断（陰性テスト）。違反を注入して各ゲートが落ちることを確認する。
  # オフライン・決定論的なため verify に含める（憲章「8. ブートストラップ規定」）。
  check:selftest:
    cmds: ["bash scripts/checks/selftest.sh"]

  # UI 再現性ゲート（constitution.md「10.1」）。UI スタック未導入時は no-op（緑）。
  check:ui:
    cmds: ["bash scripts/checks/ui.sh full"]
  check:ui-fast:
    cmds: ["bash scripts/checks/ui.sh fast"]

  # --- 監査（ネットワーク依存のため verify には含めない） ---
  audit:deps:
    desc: "依存・ツールチェーンの版数 / LTS / 既知脆弱性を監査（要ネットワーク）"
    cmds: ["bash scripts/checks/deps-audit.sh"]

  # --- helpers ---
  fix:
    desc: "Auto-fix (markdownlint --fix, regenerate ADR index, sync constitution concise-view version)"
    cmds:
      - "bash -c 'command -v markdownlint-cli2 >/dev/null 2>&1 && markdownlint-cli2 --fix \"**/*.md\" || npx --yes markdownlint-cli2 --fix \"**/*.md\"'"
      - "bash -c 'command -v python3 >/dev/null 2>&1 && python3 scripts/generate_adr_index.py || python scripts/generate_adr_index.py'"
      - "bash -c 'command -v python3 >/dev/null 2>&1 && python3 scripts/sync_constitution_version.py || python scripts/sync_constitution_version.py'"
  setup:
    desc: "Install the pinned toolchain (mise / .mise.toml)"
    cmds: ["bash scripts/setup.sh"]
  doctor:
    desc: "Show which quality-gate tools are available"
    cmds: ["bash scripts/doctor.sh"]
  hooks:
    desc: "Install git hooks via lefthook"
    cmds: ["lefthook install"]
